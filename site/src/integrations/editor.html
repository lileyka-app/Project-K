<!doctype html>
<!-- Віддає docs-editor.mjs лише під `astro dev`, повз маршрутизацію Astro: на сторінці немає клієнта Vite, тож
     збереження перезавантажує тільки праву половину, а не сам редактор з курсором і набраним текстом. -->
<html lang="uk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Редактор довідки · Лілейка</title>
		<link rel="icon" href="/favicon.svg" />
		<style>
			:root {
				--accent: #0e6e4e;
				--accent-soft: #cfe5d9;
				--ink: #101413;
				--muted: #6e7873;
				--line: #c9d0cd;
				--surface: #ffffff;
				--ground: #f7f9f8;
				--warn-bg: #fbe5e2;
				--warn-fg: #9a2b21;
				--font: 'Manrope', system-ui, -apple-system, sans-serif;
				--mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
				color-scheme: light;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--accent: #34c48d;
					--accent-soft: #084733;
					--ink: #e9edea;
					--muted: #9ba8a2;
					--line: #3a433f;
					--surface: #161b19;
					--ground: #0d1110;
					--warn-bg: #3a1d1a;
					--warn-fg: #f2b8b0;
					color-scheme: dark;
				}
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				height: 100%;
				margin: 0;
			}
			body {
				display: flex;
				flex-direction: column;
				background: var(--ground);
				color: var(--ink);
				font: 14px/1.4 var(--font);
			}

			header {
				display: flex;
				flex-wrap: wrap;
				align-items: center;
				gap: 0.5rem 0.75rem;
				padding: 0.5rem 0.75rem;
				border-bottom: 1px solid var(--line);
				background: var(--surface);
			}
			header h1 {
				margin: 0 0.25rem 0 0;
				font-size: 15px;
				font-weight: 700;
				white-space: nowrap;
			}
			.picker {
				display: flex;
				flex: 1 1 22rem;
				gap: 0.375rem;
				min-width: 0;
			}
			input,
			select,
			button,
			a.button {
				height: 2rem;
				padding: 0 0.625rem;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: var(--surface);
				color: var(--ink);
				font: inherit;
			}
			#filter {
				flex: 0 0 11rem;
			}
			#file {
				flex: 1 1 auto;
				min-width: 0;
			}
			button,
			a.button {
				display: inline-flex;
				align-items: center;
				gap: 0.375rem;
				cursor: pointer;
				text-decoration: none;
				white-space: nowrap;
			}
			button:hover,
			a.button:hover {
				border-color: var(--accent);
			}
			button.primary {
				border-color: var(--accent);
				background: var(--accent);
				color: var(--surface);
				font-weight: 600;
			}
			button:disabled {
				opacity: 0.5;
				cursor: default;
			}
			label.toggle {
				display: inline-flex;
				align-items: center;
				gap: 0.375rem;
				color: var(--muted);
				white-space: nowrap;
			}
			.status {
				min-width: 7.5rem;
				color: var(--muted);
				font-size: 13px;
				white-space: nowrap;
			}
			.status[data-state='dirty'] {
				color: var(--ink);
			}
			.status[data-state='saved'] {
				color: var(--accent);
			}
			.status[data-state='error'] {
				color: var(--warn-fg);
			}

			#banner {
				display: none;
				align-items: center;
				flex-wrap: wrap;
				gap: 0.5rem 0.75rem;
				padding: 0.5rem 0.75rem;
				background: var(--warn-bg);
				color: var(--warn-fg);
			}
			#banner.shown {
				display: flex;
			}

			main {
				display: grid;
				flex: 1;
				grid-template-columns: var(--left, 50%) 6px 1fr;
				min-height: 0;
			}
			.pane {
				display: flex;
				flex-direction: column;
				min-width: 0;
				min-height: 0;
			}
			.pane__head {
				display: flex;
				align-items: center;
				gap: 0.5rem;
				padding: 0.25rem 0.75rem;
				border-bottom: 1px solid var(--line);
				color: var(--muted);
				font-size: 12px;
			}
			.pane__head code {
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-family: var(--mono);
			}
			.pane__head .spacer {
				flex: 1;
			}
			textarea {
				flex: 1;
				width: 100%;
				min-height: 0;
				padding: 0.875rem 1rem 40vh;
				border: 0;
				outline: none;
				resize: none;
				background: var(--surface);
				color: var(--ink);
				font: 13.5px/1.65 var(--mono);
				tab-size: 2;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
			}
			iframe {
				flex: 1;
				width: 100%;
				border: 0;
				background: var(--surface);
			}
			.splitter {
				cursor: col-resize;
				background: var(--line);
			}
			.splitter:hover,
			body.dragging .splitter {
				background: var(--accent);
			}
			body.dragging iframe {
				pointer-events: none;
			}
			.hint {
				color: var(--muted);
				font-size: 12px;
			}
			kbd {
				padding: 0 0.3rem;
				border: 1px solid var(--line);
				border-radius: 4px;
				font: 11px var(--mono);
			}

			@media (max-width: 800px) {
				main {
					grid-template-columns: 1fr;
					grid-template-rows: 1fr 6px 1fr;
				}
				.splitter {
					cursor: row-resize;
				}
			}
		</style>
	</head>
	<body data-repo="__REPO_PREFIX__">
		<header>
			<h1>Редактор довідки</h1>
			<div class="picker">
				<input id="filter" type="search" placeholder="Знайти сторінку" aria-label="Знайти сторінку" />
				<select id="file" aria-label="Сторінка"></select>
			</div>
			<label class="toggle"><input id="autosave" type="checkbox" checked /> Зберігати самому</label>
			<button id="save" class="primary" type="button" title="Ctrl+S">Зберегти</button>
			<a id="vscode" class="button" href="#">У VS Code</a>
			<a id="open" class="button" href="#" target="_blank" rel="noopener">Сторінка ↗</a>
			<output id="status" class="status"></output>
		</header>

		<div id="banner" role="alert">
			<span id="banner-text"></span>
			<button id="reload" type="button">Взяти з диска</button>
			<button id="overwrite" type="button">Записати моє</button>
		</div>

		<main id="main">
			<section class="pane" aria-label="Джерело">
				<div class="pane__head">
					<code id="source-path"></code>
					<span class="spacer"></span>
					<span class="hint"><kbd>Ctrl</kbd>+<kbd>S</kbd> зберегти · подвійний клік на сторінці — до цього місця в тексті</span>
				</div>
				<textarea id="text" spellcheck="true" lang="uk" aria-label="Текст сторінки"></textarea>
			</section>
			<div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Межа між половинами" tabindex="0"></div>
			<section class="pane" aria-label="Як виглядає">
				<div class="pane__head">
					<code id="page-url"></code>
					<span class="spacer"></span>
					<button id="refresh" type="button" style="height:1.5rem">Оновити</button>
				</div>
				<iframe id="preview" title="Сторінка довідки"></iframe>
			</section>
		</main>

		<script type="module">
			const $ = (id) => document.getElementById(id);
			const filter = $('filter');
			const picker = $('file');
			const text = $('text');
			const preview = $('preview');
			const status = $('status');
			const banner = $('banner');
			const autosave = $('autosave');

			const AUTOSAVE_MS = 700;
			let pages = [];
			let current = null;
			let modified = 0;
			let savedText = '';
			let saving = false;
			let timer;

			const dirty = () => text.value !== savedText;

			function setStatus(message, state = 'idle') {
				status.textContent = message;
				status.dataset.state = state;
			}

			function showConflict(message) {
				banner.classList.toggle('shown', message !== null);
				$('banner-text').textContent = message ?? '';
			}

			/** Only a path on this site may become a link or the preview: never another origin or a `javascript:` URL. */
			function sameSiteHref(url) {
				const parsed = new URL(url, location.origin);
				return parsed.origin === location.origin ? parsed.pathname : '/';
			}

			async function api(path, init) {
				const res = await fetch(`/__docs/${path}`, init);
				const body = await res.json().catch(() => ({}));
				return { ok: res.ok, status: res.status, body };
			}

			function renderPicker() {
				const query = filter.value.trim().toLowerCase();
				const visible = pages.filter(
					(p) => !query || p.title.toLowerCase().includes(query) || p.source.toLowerCase().includes(query),
				);
				picker.replaceChildren(
					...['user', 'dev']
						.map((section) => {
							const group = document.createElement('optgroup');
							group.label = section === 'user' ? 'Для користувача' : 'Для розробника';
							for (const page of visible.filter((p) => p.section === section)) {
								const option = document.createElement('option');
								option.value = page.source;
								option.textContent = `${page.title} — ${page.url}`;
								group.append(option);
							}
							return group;
						})
						.filter((group) => group.children.length > 0),
				);
				if (current) {
					picker.value = current.source;
				}
			}

			async function open(source) {
				if (current && dirty() && !confirm('Є незбережені зміни. Відкрити іншу сторінку й загубити їх?')) {
					picker.value = current.source;
					return;
				}
				const page = pages.find((p) => p.source === source);
				if (!page) {
					return;
				}
				const { ok, body } = await api(`file?source=${encodeURIComponent(source)}`);
				if (!ok) {
					setStatus(body.message ?? 'Не відкрилось', 'error');
					return;
				}
				current = page;
				modified = body.modified;
				savedText = body.text;
				text.value = body.text;
				text.setSelectionRange(0, 0);
				text.scrollTop = 0;
				showConflict(null);
				setStatus('Відкрито');

				picker.value = source;
				$('source-path').textContent = source;
				const pageHref = sameSiteHref(page.url);
				$('page-url').textContent = pageHref;
				$('open').href = pageHref;
				$('vscode').href = `vscode://file/${encodeURI((document.body.dataset.repo ?? '') + source)}`;
				preview.src = pageHref;
				history.replaceState(null, '', `?source=${encodeURIComponent(source)}`);
				document.title = `${page.title} · Редактор довідки`;
			}

			async function save(force = false) {
				if (!current || saving || (!dirty() && !force)) {
					return;
				}
				saving = true;
				const sending = text.value;
				setStatus('Зберігаю…', 'dirty');
				const headers = { 'Content-Type': 'text/plain; charset=utf-8', 'X-Docs-Modified': String(modified) };
				if (force) {
					headers['X-Docs-Force'] = '1';
				}
				const { ok, status: code, body } = await api(`file?source=${encodeURIComponent(current.source)}`, {
					method: 'PUT',
					headers,
					body: sending,
				});
				saving = false;

				if (code === 409) {
					showConflict('Файл змінили поза редактором (VS Code, git). Що взяти?');
					setStatus('Конфлікт', 'error');
					return;
				}
				if (!ok) {
					setStatus(body.message ?? 'Не збереглось', 'error');
					return;
				}
				modified = body.modified;
				savedText = sending;
				showConflict(null);
				setStatus(dirty() ? 'Є нові зміни' : 'Збережено', dirty() ? 'dirty' : 'saved');
			}

			/** The heading the caret sits under, as text: «## Каса гуртка» → «Каса гуртка». */
			function headingAboveCaret() {
				const before = text.value.slice(0, text.selectionStart);
				const headings = [...before.matchAll(/^#{1,6}\s+(\S.*)$/gm)];
				return headings.length ? withoutClosingHashes(headings[headings.length - 1][1]) : null;
			}

			/** «Каса гуртка ##» → «Каса гуртка»: the optional closing sequence of an ATX heading. */
			function withoutClosingHashes(heading) {
				let rest = heading.trimEnd();
				while (rest.endsWith('#')) {
					rest = rest.slice(0, -1);
				}
				return rest.trimEnd();
			}

			const plain = (s) =>
				s
					.replace(/[*_`]/g, '')
					.replace(/\[([^[\]]+)\]\([^)]*\)/g, '$1')
					.replace(/\s+/g, ' ')
					.trim()
					.toLowerCase();

			function syncPreview() {
				const doc = preview.contentDocument;
				if (!doc) {
					return;
				}
				const heading = headingAboveCaret();
				if (!heading) {
					doc.defaultView?.scrollTo({ top: 0, behavior: 'smooth' });
					return;
				}
				const wanted = plain(heading);
				const target = [...doc.querySelectorAll('main h1, main h2, main h3, main h4')].find(
					(el) => plain(el.textContent ?? '') === wanted,
				);
				target?.scrollIntoView({ behavior: 'smooth', block: 'start' });
			}

			let lastHeading = null;
			function maybeSync() {
				const heading = headingAboveCaret();
				if (heading !== lastHeading) {
					lastHeading = heading;
					syncPreview();
				}
			}

			function revealInSource(word, under) {
				const source = text.value;
				let from = 0;
				if (under) {
					const line = [...source.matchAll(/^#{1,6}\s+(\S.*)$/gm)].find((m) => plain(m[1]) === plain(under));
					from = line?.index ?? 0;
				}
				const lower = source.toLowerCase();
				let at = lower.indexOf(word.toLowerCase(), from);
				if (at < 0) {
					at = lower.indexOf(word.toLowerCase());
				}
				if (at < 0) {
					setStatus(`«${word}» у тексті не знайдено`, 'error');
					return;
				}
				text.focus();
				text.setSelectionRange(at, at + word.length);
				// Put the line roughly a third down the pane.
				const lineIndex = source.slice(0, at).split('\n').length - 1;
				const lineHeight = Number.parseFloat(getComputedStyle(text).lineHeight) || 22;
				text.scrollTop = Math.max(0, lineIndex * lineHeight - text.clientHeight / 3);
			}

			function wirePreview() {
				const doc = preview.contentDocument;
				if (!doc) {
					return;
				}
				doc.addEventListener('dblclick', () => {
					const selection = doc.getSelection();
					const word = selection?.toString().trim();
					if (!word || !selection?.anchorNode) {
						return;
					}
					let el = selection.anchorNode.parentElement;
					let under = null;
					while (el && !under) {
						let sibling = el;
						while (sibling && !under) {
							if (/^H[1-6]$/.test(sibling.tagName)) {
								under = sibling.textContent;
							}
							sibling = sibling.previousElementSibling;
						}
						el = el.parentElement;
					}
					revealInSource(word, under);
				});
			}

			function wireSplitter() {
				const splitter = $('splitter');
				const main = $('main');
				const saved = localStorage.getItem('docs-editor-left');
				if (saved) {
					main.style.setProperty('--left', saved);
				}
				splitter.addEventListener('pointerdown', (event) => {
					splitter.setPointerCapture(event.pointerId);
					document.body.classList.add('dragging');
				});
				splitter.addEventListener('pointermove', (event) => {
					if (!document.body.classList.contains('dragging')) {
						return;
					}
					const rect = main.getBoundingClientRect();
					const share = Math.min(80, Math.max(20, ((event.clientX - rect.left) / rect.width) * 100));
					main.style.setProperty('--left', `${share.toFixed(1)}%`);
				});
				splitter.addEventListener('pointerup', () => {
					document.body.classList.remove('dragging');
					try {
						localStorage.setItem('docs-editor-left', main.style.getPropertyValue('--left'));
					} catch {
						/* storage may be off; the split is only a convenience */
					}
				});
			}

			text.addEventListener('input', () => {
				setStatus('Є зміни', 'dirty');
				clearTimeout(timer);
				if (autosave.checked) {
					timer = window.setTimeout(() => save(), AUTOSAVE_MS);
				}
			});
			text.addEventListener('keydown', (event) => {
				if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
					event.preventDefault();
					clearTimeout(timer);
					save();
				} else if (event.key === 'Tab' && !event.shiftKey) {
					event.preventDefault();
					text.setRangeText('  ', text.selectionStart, text.selectionEnd, 'end');
					text.dispatchEvent(new Event('input'));
				}
			});
			for (const type of ['keyup', 'click']) {
				text.addEventListener(type, maybeSync);
			}
			document.addEventListener('keydown', (event) => {
				if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
					event.preventDefault();
					save();
				}
			});
			window.addEventListener('beforeunload', (event) => {
				if (dirty()) {
					event.preventDefault();
				}
			});

			preview.addEventListener('load', () => {
				wirePreview();
				syncPreview();
			});
			picker.addEventListener('change', () => open(picker.value));
			filter.addEventListener('input', renderPicker);
			$('save').addEventListener('click', () => save());
			$('refresh').addEventListener('click', () => preview.contentWindow?.location.reload());
			$('reload').addEventListener('click', async () => {
				if (current) {
					savedText = text.value; // the choice is made: drop the local text without asking
					const source = current.source;
					current = null;
					await open(source);
				}
			});
			$('overwrite').addEventListener('click', () => save(true));

			wireSplitter();

			const listed = await api('list');
			if (listed.ok) {
				pages = listed.body;
				renderPicker();
				const wanted = new URLSearchParams(location.search).get('source');
				await open(pages.some((p) => p.source === wanted) ? wanted : pages[0].source);
			} else {
				setStatus('Перелік сторінок не прочитався', 'error');
			}
		</script>
	</body>
</html>
