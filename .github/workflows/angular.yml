name: Frontend CI/CD

on:
  # Every branch is linted, tested and built. PRs stay wired up only for the Azure SWA
  # preview environments, not as a review gate.
  push:
    branches: [ "**" ]
    paths:
      - 'Frontend/**'
      # The phone PWA ships inside the same site, under /m/.
      - 'mobile/**'
      # A change to the pipeline is a change that has to run through it.
      - '.github/workflows/angular.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ "main", "dev" ]
    paths:
      - 'Frontend/**'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  lint_and_test:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Lint and Test
    steps:
      - uses: actions/checkout@v7

      # One place decides the version and code name for every workflow; it leaves VERSION and
      # CODENAME in the job environment, a dev placeholder when this is not a release.
      - name: Extract Release Info
        uses: ./.github/actions/release-info

      - name: Inject Versioning to Angular
        shell: bash
        run: |
          : "${VERSION:?no version resolved by an earlier step}"
          ENV_FILES=$(find Frontend/projectk-frontend/src/environments/ mobile/src/environments/ -name "environment*.ts")
          for file in $ENV_FILES; do
            sed -i "s/v0.0.0-dev/${VERSION}/g" "$file"
            # CODENAME is empty for a release without a code name, which blanks the placeholder.
            sed -i "s/LocalDevelopment/${CODENAME}/g" "$file"
          done

      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Frontend/projectk-frontend/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: Frontend/projectk-frontend

      # Lint is a real gate again: sonarjs findings are warnings, so only genuine errors fail.
      - name: Run lint
        run: npm run lint
        working-directory: Frontend/projectk-frontend

      - name: Test
        run: npm run test-c -- --watch=false --browsers=ChromeHeadless
        working-directory: Frontend/projectk-frontend

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: Frontend/projectk-frontend/coverage/
          if-no-files-found: warn

      - name: Notify dev Telegram on frontend failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_TEXT: |
            [ProjectK] Frontend workflow failed
            Workflow: ${{ github.workflow }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/send-telegram-message.sh

  build_and_deploy:
    needs: lint_and_test
    # The push trigger now covers every branch, so deployment is pinned to dev and releases.
    # PR builds still deploy, because that is how SWA preview environments are produced. A push to
    # main is left out: it lands just before the release and would ship a 0.0.0-dev build over it.
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action != 'closed')
      || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    name: Build and Deploy to Azure SWA
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false
          
      # The same pair the build job and the API carry: this job used to work it out on its own,
      # kept the "v" and invented a code name, so one release showed under two names.
      - name: Extract Release Info
        uses: ./.github/actions/release-info

      - name: Inject Versioning
        shell: bash
        run: |
          ENV_FILES=$(find Frontend/projectk-frontend/src/environments/ mobile/src/environments/ -name "environment*.ts")
          for file in $ENV_FILES; do
            sed -i "s/v0.0.0-dev/$VERSION/g" "$file"
            sed -i "s/LocalDevelopment/$CODENAME/g" "$file"
          done

      # Built here rather than by the deploy action. Azure's Oryx image pins Node 22.22.0 and the
      # Angular 22 CLI refuses anything below 22.22.3, so letting SWA build fails before it starts.
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: Frontend/projectk-frontend/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: Frontend/projectk-frontend

      - name: Build
        run: npm run build -- --configuration ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
        working-directory: Frontend/projectk-frontend

      # The phone PWA (mobile/) is served from the same origin under /m/, so it shares the web's
      # CORS entry, cookies and env.js.
      - run: npm ci --ignore-scripts
        working-directory: mobile

      - name: Build the phone PWA into /m/
        run: |
          npm run ng -- build --configuration ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'production,staging' }} --base-href /m/
          cp -R www ../Frontend/projectk-frontend/dist/projectk-frontend/browser/m
        working-directory: mobile

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "Frontend/projectk-frontend/dist/projectk-frontend/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Notify dev Telegram on frontend deploy failure
        if: failure()
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
          TELEGRAM_TEXT: |
            [ProjectK] Frontend deploy failed
            Environment: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/send-telegram-message.sh

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    # The preview was uploaded by build_and_deploy, which for a pull request always lands on the
    # staging app (github.ref is refs/pull/N/merge there, never main). Closing it on the production
    # app instead left every dev → main preview behind until SWA refused new ones.
    environment:
      name: staging
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
