name: Backend CI/CD

on:
  # Every branch gets built, tested and analysed. Pull requests are not a gate here: the project has
  # a single maintainer who reviews their own PRs, so waiting for one adds nothing.
  push:
    branches: [ "**" ]
    paths:
      - 'Backend/**'
      # A change to the pipeline is a change that has to run through it.
      - '.github/workflows/dotnet.yml'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # One place decides the version and code name for every workflow; it leaves VERSION and
    # CODENAME in the job environment, a dev placeholder when this is not a release.
    - name: Extract Release Info
      uses: ./.github/actions/release-info

    - name: Inject Versioning
      shell: bash
      run: |
        : "${VERSION:?no version resolved by an earlier step}"
        FILES=$(find Backend/ProjectK.Backend/ProjectK.API/ -name "appsettings*.json")
        echo "Updating files: $FILES"
        for file in $FILES; do
          sed -i "s/v0.0.0-dev/${VERSION}/g" "$file"
          # CODENAME is empty for a release without a code name, which blanks the placeholder.
          sed -i "s/LocalDevelopment/${CODENAME}/g" "$file"
        done

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Backend/ProjectK.Backend
      env: 
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
      
    # `shell: bash` for the pipefail it brings: without it `| tee` reports the exit code of tee, and
    # a build that failed to compile was reported as a green step for weeks.
    - name: Build
      shell: bash
      run: dotnet build Backend/ProjectK.Backend --configuration Release --no-restore 2>&1 | tee build.log

    # Advisory only. The analyzer backlog is tracked in docs/quality-baseline.md and driven down
    # deliberately; a red build on day one would just get ignored.
    - name: Report analyzer warnings
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        grep -E ': warning ' build.log | sed -E 's/ \[[^]]*\]$//' | sort -u > warnings.txt || true
        TOTAL=$(wc -l < warnings.txt)
        {
          echo "## Analyzer warnings: $TOTAL"
          echo "_Baseline 652 — see docs/quality-baseline.md_"
          echo
          echo "| Project | Count |"
          echo "|---|---:|"
          grep -oE 'ProjectK\.Backend./[A-Za-z.]+' warnings.txt \
            | sed -E 's|.*ProjectK\.Backend./||' | sort | uniq -c | sort -rn \
            | awk '{printf "| %s | %s |\n", $2, $1}'
          echo
          echo "| Rule | Count |"
          echo "|---|---:|"
          grep -oE 'warning [A-Z]+[0-9]+' warnings.txt | sed 's/warning //' \
            | sort | uniq -c | sort -rn | head -15 \
            | awk '{printf "| %s | %s |\n", $2, $1}'
        } >> "$GITHUB_STEP_SUMMARY"

    # Advisory too, for now: the whole backend was normalised in one pass (FMT-01), and this is
    # what keeps it from drifting back. Turn it blocking once a couple of releases have gone by
    # without it firing. Migrations are EF-generated and excluded on purpose.
    - name: Check formatting
      if: always()
      continue-on-error: true
      run: dotnet format Backend/ProjectK.Backend/ProjectK.Backend.sln --verify-no-changes --no-restore --exclude "**/Migrations/**"

    - name: Test
      run: >-
        dotnet test Backend/ProjectK.Backend --configuration Release --no-build --verbosity normal
        --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: backend-coverage
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

    - name: Notify dev Telegram on backend failure
      if: failure()
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
        TELEGRAM_TEXT: |
          [ProjectK] Backend workflow failed
          Workflow: ${{ github.workflow }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash .github/scripts/send-telegram-message.sh

    - name: Publish Artifact
      # ReadyToRun: App Service is linux-x64 on one B1 core, where JIT after a deploy made the first
      # dashboard take 13 s. Precompiled code cuts that; the Docker image stays portable.
      run: dotnet publish Backend/ProjectK.Backend/ProjectK.API/ProjectK.API.csproj -c Release -r linux-x64 --self-contained false -p:PublishReadyToRun=true -o ./publish
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: dotnet-app
        path: ./publish/

  deploy:
    # Only the long-lived branches and releases deploy. The push trigger above now covers every
    # branch, so without this a feature branch would ship straight to staging.
    if: >-
      github.event_name == 'release'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: 
      name: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
    
    steps:
    - uses: actions/checkout@v7

    - name: Download Artifact
      uses: actions/download-artifact@v7
      with:
        name: dotnet-app

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    # No health check after the deploy, on purpose. The *.azurewebsites.net host admits only
    # Cloudflare (SEC-4.1), and Cloudflare's Bot Fight Mode answers GitHub's runners with a 403
    # challenge that no rule can skip, so a probe from here never reaches the API. After a release,
    # check /health on the public host by hand.

    - name: Notify dev Telegram on backend deploy failure
      if: failure()
      shell: bash
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_ALERTS_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_DEV_ALERTS_CHAT_ID }}
        TELEGRAM_TEXT: |
          [ProjectK] Backend deploy failed
          Environment: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'release') && 'production' || 'staging' }}
          Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash .github/scripts/send-telegram-message.sh
