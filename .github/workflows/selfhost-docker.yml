name: Self-host Docker Bundle

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to package, for example 0.14.2-beta
        required: false
        default: 0.14.2-beta
      codename:
        description: Release codename to inject into the Docker images
        required: false
        default: SelfHostBuild

permissions:
  contents: write
  packages: write

jobs:
  docker-and-bundle:
    runs-on: ubuntu-latest
    env:
      GHCR_LEGACY_TOKEN: ${{ secrets.GHCR_LEGACY_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The same pair dotnet.yml and angular.yml build with. A workflow_dispatch run names its own
      # version; a release takes it from the tag, whatever the inputs say.
      - name: Extract Release Info
        uses: ./.github/actions/release-info
        with:
          version: ${{ github.event.inputs.version }}
          codename: ${{ github.event.inputs.codename }}

      - name: Name the bundle and images after it
        shell: bash
        run: |
          echo "PROJECTK_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          # No "v": one spelling everywhere, the same one the image tag and /health carry.
          echo "RELEASE_INFO_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_INFO_CODENAME=$CODENAME" >> "$GITHUB_ENV"

      - name: Inject versioning into Docker build context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_INFO_VERSION"]
          codename = os.environ["RELEASE_INFO_CODENAME"]
          roots = [
              Path("Backend/ProjectK.Backend/ProjectK.API"),
              Path("Frontend/projectk-frontend/src/environments"),
              Path("mobile/src/environments"),
          ]
          patterns = ["appsettings*.json", "environment*.ts", "environment*.ts"]

          for root, pattern in zip(roots, patterns):
              for path in root.glob(pattern):
                  text = path.read_text(encoding="utf-8-sig")
                  text = text.replace("v0.0.0-dev", version)
                  text = text.replace("LocalDevelopment", codename)
                  path.write_text(text, encoding="utf-8")
                  print(f"Injected release info into {path}")
          PY

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Backend/Dockerfile
          push: true
          secrets: |
            nuget_auth_token=${{ secrets.NUGET_AUTH_TOKEN }}
          tags: |
            ghcr.io/lileyka-app/projectk-api:${{ env.IMAGE_VERSION }}
            ghcr.io/lileyka-app/projectk-api:beta
          labels: |
            org.opencontainers.image.title=Project-K API
            org.opencontainers.image.description=Project-K self-host ASP.NET Core API
            org.opencontainers.image.version=${{ env.RELEASE_INFO_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Frontend/projectk-frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/lileyka-app/projectk-web:${{ env.IMAGE_VERSION }}
            ghcr.io/lileyka-app/projectk-web:beta
          labels: |
            org.opencontainers.image.title=Project-K Web
            org.opencontainers.image.description=Project-K self-host Angular frontend
            org.opencontainers.image.version=${{ env.RELEASE_INFO_VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Installs set up before the move to the org pull from ghcr.io/iamavasya. The repo's own token
      # cannot write there, so a personal token with write:packages copies the images over.
      - name: Mirror images to the pre-org namespace
        if: env.GHCR_LEGACY_TOKEN != ''
        shell: bash
        run: |
          echo "$GHCR_LEGACY_TOKEN" | docker login ghcr.io -u iamavasya --password-stdin
          for image in projectk-api projectk-web; do
            for tag in "$IMAGE_VERSION" beta; do
              docker buildx imagetools create \
                -t "ghcr.io/iamavasya/$image:$tag" "ghcr.io/lileyka-app/$image:$tag"
            done
          done

      - name: Build self-host bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="projectk-${PROJECTK_VERSION}-docker-selfhost"
          mkdir -p "$bundle"
          cp docker/selfhost/compose.bundle.yml "$bundle/docker-compose.yml"
          cp docker/selfhost/.env.example "$bundle/.env.example"
          cp docs/self-host/README.md "$bundle/README.md"
          cp docs/self-host/backup-restore.md "$bundle/backup-restore.md"
          cp docs/self-host/update.md "$bundle/update.md"
          sed -i "s/^PROJECTK_VERSION=.*/PROJECTK_VERSION=${PROJECTK_VERSION}/" "$bundle/.env.example"
          zip -r "$bundle.zip" "$bundle"
          tar -czf "$bundle.tar.gz" "$bundle"
          sha256sum "$bundle.zip" "$bundle.tar.gz" > SHA256SUMS.txt

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: projectk-selfhost-bundle
          path: |
            projectk-${{ env.PROJECTK_VERSION }}-docker-selfhost.zip
            projectk-${{ env.PROJECTK_VERSION }}-docker-selfhost.tar.gz
            SHA256SUMS.txt

      - name: Attach bundle to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "projectk-${PROJECTK_VERSION}-docker-selfhost.zip" \
            "projectk-${PROJECTK_VERSION}-docker-selfhost.tar.gz" \
            SHA256SUMS.txt \
            --clobber
