<div class="lil-page">
  <header class="lil-page-head">
    <div>
      <h1>Календар</h1>
    </div>
    @if (canManage()) {
      <div class="lil-page-head__actions">
        <p-button label="Нова подія" icon="pi pi-plus" (click)="openCreate()" />
      </div>
    }
  </header>

  <section class="kurin-tile">
    <div class="agenda-toolbar">
      <div class="agenda-toolbar__nav">
        <p-button icon="pi pi-chevron-left" severity="secondary" [text]="true" [rounded]="true" (click)="prev()" ariaLabel="Назад" />
        <p-button label="Сьогодні" severity="secondary" [outlined]="true" size="small" (click)="today()" />
        <p-button icon="pi pi-chevron-right" severity="secondary" [text]="true" [rounded]="true" (click)="next()" ariaLabel="Далі" />
        <span class="agenda-toolbar__title">{{ viewTitle() }}</span>
      </div>
      <span class="agenda-toolbar__schedules">
        <p-toggleswitch inputId="agenda-show-schedules" [(ngModel)]="showSchedules" (onChange)="onShowSchedulesChange()" />
        <label for="agenda-show-schedules">Графіки гуртків</label>
      </span>
      <p-selectButton
        [options]="viewOptions"
        [ngModel]="currentView()"
        (onChange)="changeView($event.value)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false" />
    </div>

    <div class="agenda-calendar-host">
      <full-calendar [options]="calendarOptions()" />
    </div>
  </section>
</div>

<!-- Rendered for everyone: managers get the edit form, plain members a read-only view with RSVP. The
     dialog only mounts the mentor-only assign-select in edit mode, so viewers never hit its 403. -->
<app-agenda-item-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [kurinKey]="kurinKey()"
  [item]="editing()"
  [defaultKind]="'Event'"
  [canManage]="canManage()"
  [presetStart]="presetStart()"
  [presetEnd]="presetEnd()"
  [presetAllDay]="presetAllDay()"
  (saved)="onSaved()" />
