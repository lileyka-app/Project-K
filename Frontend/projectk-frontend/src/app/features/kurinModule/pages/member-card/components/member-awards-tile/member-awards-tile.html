<div class="flex flex-col gap-4">
    <div class="lil-tile-head">
        <h2>Відзначення УПЮ</h2>
        @if (canEdit()) {
            <p-button icon="pi pi-plus" [rounded]="true" [text]="true" severity="secondary" ariaLabel="Додати відзначення" (onClick)="openDialog()" />
        }
    </div>

    <app-award-blocks [blocks]="blocks" [ownCard]="ownCard()" emptyText="Немає здобутих відзначень"
        (openGrant)="openGrant($event)" (togglePin)="pinAward.emit($event)" />
</div>

<app-member-awards-dialog [(visible)]="dialogVisible"
    [awardToEdit]="selectedAward"
    [existingAwards]="awards()"
    [canEdit]="canEditAward(selectedAward)"
    [canReview]="canConfirm(selectedAward)"
    [canDelete]="canDeleteAward(selectedAward)"
    (save)="onSave($event)"
    (approve)="approveAward($event)"
    (delete)="confirmDelete($event)" />

<p-confirmDialog />
