<div class="flex flex-col gap-4" data-testid="degrees-tile">
    <div class="lil-tile-head">
        <h2>Ступені</h2>
        @if (canEdit()) {
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" ariaLabel="Змінити ступені" (onClick)="edit.emit()" data-testid="degrees-edit" />
        }
    </div>

    @if (highest(); as top) {
        <div class="degree-highest" data-testid="degree-highest">
            @if (top.imageUrl) {
                <img class="degree-highest-image" [src]="top.imageUrl" [alt]="top.title" loading="lazy" />
            } @else {
                <span class="degree-highest-image degree-image--empty pi pi-flag" aria-hidden="true"></span>
            }
            <div class="degree-highest-text">
                <span class="degree-highest-title">{{ top.title }}</span>
                @if (top.date) {
                    <span class="degree-date">{{ top.date | date: 'dd.MM.yyyy' }}</span>
                }
            </div>
        </div>
    } @else {
        <p class="degree-empty">Ступенів ще немає</p>
    }
</div>
