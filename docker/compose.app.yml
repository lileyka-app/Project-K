# Parameterized application stack (API + Web) for a single environment.
#
# The .NET image is environment-agnostic: the environment is chosen at runtime
# via ASPNETCORE_ENVIRONMENT, so one built image serves dev/e2e/selfhost/...
# The Angular build configuration (NG_CONFIG) is baked at build time, while the
# API URL stays runtime-injectable (PROJECTK_API_URL -> env.js).
#
# Do not run this file directly — use ./scripts/dev.sh which loads the matching
# docker/env/<env>.env, sets COMPOSE_PROJECT_NAME=projectk-<env>, and ensures the
# shared projectk-dev-net network + tooling are running first.
#
# Images are tagged locally (projectk-*:<env>-local) and are never pushed to a
# registry. To consume a prebuilt image instead of building, set
# PROJECTK_API_IMAGE / PROJECTK_WEB_IMAGE in the env file (e.g. a ghcr.io tag).

services:
  projectk-api:
    image: ${PROJECTK_API_IMAGE:-projectk-api:${PROJECTK_ENV:-dev}-local}
    build:
      context: ..
      dockerfile: Backend/Dockerfile
      # A build secret, not an arg: the token never lands in an image layer.
      secrets:
        - nuget_auth_token
    environment:
      ASPNETCORE_ENVIRONMENT: ${PROJECTK_ASPNETCORE_ENV}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${PROJECTK_DB_CONNECTION_STRING}
      ConnectionStrings__BlobStorage: ${PROJECTK_BLOB_CONNECTION_STRING}
      BlobStorage__PublicBaseUrl: ${PROJECTK_BLOB_PUBLIC_BASE_URL:-http://localhost:10000/devstoreaccount1/photos}
      BlobStorage__ContainerName: ${PROJECTK_BLOB_CONTAINER:-photos}
      EnvCorsOrigin: ${PROJECTK_CORS_ORIGIN:-http://localhost:4200}
      Email__BaseUrl: ${PROJECTK_PUBLIC_URL:-http://localhost:4200}
      Email__ReplyTo: ${PROJECTK_EMAIL_REPLY_TO:-}
      Jwt__Key: ${PROJECTK_JWT_KEY:-local-development-jwt-key-change-me-please-32+}
      Jwt__Issuer: ${PROJECTK_JWT_ISSUER:-ProjectK-Backend}
      Jwt__Audience: ${PROJECTK_JWT_AUDIENCE:-ProjectK-Users}
      Telegram__DevAlerts__Enabled: "false"
      Telegram__PublicChannel__Enabled: "false"
      # Off in every local stack: selfhost and prod run as SelfHost/Production, where the ping is on,
      # and would report a v0.0.0-dev install to the real status service.
      Telemetry__Enabled: ${PROJECTK_TELEMETRY:-false}
      Feedback__GitHub__Token: ${PROJECTK_FEEDBACK_GITHUB_TOKEN:-}
      Feedback__GitHub__Repository: ${PROJECTK_FEEDBACK_GITHUB_REPOSITORY:-iamavasya/Project-K}
      # Web Push to the PWA (VAPID). Both keys or none: without them push is off. The e2e env sets a
      # throwaway test pair; real deployments generate their own and keep the private key secret.
      WebPush__PublicKey: ${PROJECTK_WEBPUSH_PUBLIC_KEY:-}
      WebPush__PrivateKey: ${PROJECTK_WEBPUSH_PRIVATE_KEY:-}
      WebPush__Subject: ${PROJECTK_WEBPUSH_SUBJECT:-}
      # LAN/test convenience: skip privileged-MFA for Admin/Manager (mirrors appsettings.E2E.json).
      # Defaults off; opt in per env with PROJECTK_BYPASS_MFA=true. Never enable for staging/prod.
      E2E__BypassPrivilegedMfa: ${PROJECTK_BYPASS_MFA:-false}
    ports:
      - "${PROJECTK_API_PORT:-5205}:8080"
    networks:
      - projectk-dev-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  projectk-web:
    image: ${PROJECTK_WEB_IMAGE:-projectk-web:${PROJECTK_ENV:-dev}-local}
    build:
      context: ..
      dockerfile: Frontend/projectk-frontend/Dockerfile
      args:
        NG_CONFIG: ${PROJECTK_NG_CONFIG:-development}
    environment:
      PROJECTK_API_URL: ${PROJECTK_API_URL:-http://localhost:5205/api}
      PROJECTK_ENVIRONMENT_NAME: ${PROJECTK_ENVIRONMENT_NAME:-Development}
      PROJECTK_DOCS_URL: ${PROJECTK_DOCS_URL:-https://docs-dev.lileyka.app/}
    ports:
      - "${PROJECTK_WEB_PORT:-4200}:80"
    depends_on:
      projectk-api:
        condition: service_healthy
    networks:
      - projectk-dev-net
    healthcheck:
      # 127.0.0.1, not localhost: nginx listens on IPv4 only, while localhost
      # resolves to ::1 first inside the container and the probe is refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 10

  # The docs site, next to the app on stands shown to people. Off by default: dev.sh turns the
  # profile on when the env file sets PROJECTK_DOCS_PORT.
  projectk-docs:
    profiles: ["docs"]
    image: ${PROJECTK_DOCS_IMAGE:-projectk-docs:${PROJECTK_ENV:-dev}-local}
    build:
      context: ..
      dockerfile: site/Dockerfile
    ports:
      - "${PROJECTK_DOCS_PORT:-4321}:8080"
    networks:
      - projectk-dev-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10

networks:
  projectk-dev-net:
    name: projectk-dev-net
    external: true

secrets:
  nuget_auth_token:
    environment: NUGET_AUTH_TOKEN
